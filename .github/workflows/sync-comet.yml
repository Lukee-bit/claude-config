name: Sync comet branch
# `comet` is main plus one deviation: the fallback browser. Every push to main is merged into it.
# A conflict fails the run (red X) and leaves `comet` untouched; merge by hand then.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-comet
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: comet
          fetch-depth: 0
      - name: Merge main into comet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # comet and main both prepend entries to CHANGELOG.md, so a text merge always conflicts; keep both sides.
          echo 'CHANGELOG.md merge=union' >> .git/info/attributes
          git merge --no-edit -m "Merge main into comet" origin/main
          git push origin comet
